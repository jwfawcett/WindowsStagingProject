<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows UAC Demo</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #333;
    font-family: "Segoe UI", Arial, sans-serif;
}

.uac-window {
    width: 100%;
    max-width: 749px;
    min-height: 791px;
    margin: 0 auto;
    background: #e6e6e6;
    color: #111;
}

.header {
    height: 162px;
    background: #78b8e9;
    padding: 14px 35px;
    position: relative;
}

.header-title {
    font-size: 20px;
    margin-bottom: 20px;
}

.close {
    position: absolute;
    right: 28px;
    top: 10px;
    font-size: 30px;
    font-weight: 200;
}

.header-question {
    font-size: 32px;
    line-height: 1.35;
    margin: 0;
    font-weight: 400;
}

.content {
    padding: 38px 36px 30px;
}

.app-info {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 42px;
}

.app-icon {
    width: 66px;
    height: 52px;
    background: linear-gradient(160deg, #333, #050505 65%);
    border: 2px solid #999;
    box-shadow: inset 0 0 4px #aaa;
}

.app-name {
    font-size: 30px;
}

.publisher {
    font-size: 23px;
    margin-bottom: 36px;
}

.details {
    color: #006699;
    font-size: 23px;
    margin-bottom: 18px;
}

.instruction {
    font-size: 23px;
    margin-bottom: 27px;
}

.input-demo {
    width: 75%;
    height: 54px;
    border: 2px solid #888;
    background: #eee;
    margin-bottom: 20px;
    padding: 10px 13px;
    font-size: 22px;
    color: #555;
}

.choices {
    color: #006699;
    font-size: 23px;
    margin-top: 33px;
}

.buttons {
    display: flex;
    gap: 6px;
    margin-top: 34px;
}

button {
    width: 50%;
    height: 54px;
    border: none;
    background: #b7b7b7;
    font-size: 23px;
    color: #111;
}

button:enabled {
    cursor: pointer;
}

.demo-label {
    font-size: 12px;
    color: #555;
    margin-top: 12px;
}

@media(max-width: 600px) {
    .header-question {
        font-size: 25px;
    }

    .app-name {
        font-size: 23px;
    }

    .publisher,
    .instruction {
        font-size: 18px;
    }

    .input-demo {
        width: 100%;
    }

    .content {
        padding: 25px 20px;
    }
}
</style>
</head>

<body>

<div class="uac-window">

    <div class="header">
        <div class="header-title">User Account Control</div>
        <div class="close">&times;</div>

        <p class="header-question">
            Do you want to allow this app to make
            changes to your device?
        </p>
    </div>

    <div class="content">

        <div class="app-info">
            <div class="app-icon"></div>
            <div class="app-name">Windows Command Processor</div>
        </div>

        <div class="publisher">
            Verified publisher: Microsoft Windows
        </div>

        <div class="details">Show more details</div>

        <div class="instruction">
            To continue, enter an admin user name and password.
        </div>

        <input class="input-demo"
               type="text"
               placeholder="Username"
               enabled>

        <br>

        <input class="input-demo"
               type="password"
               placeholder="Password"
               enabled>

        <div class="choices">More choices</div>

        <div class="buttons">
        <button type="button" id="yes-btn">Yes</button>
        <button type="button" id="no-btn">No</button>
        </div>



       

    </div>

</div>

</body>
</html>
